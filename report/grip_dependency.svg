<text x="420" y="660" class="l" fill="#be123c">feedback: the arms move ⇒ new contacts and site positions</text>
<path d="M10,588 L20,588" fill="none" stroke="#be123c" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ahr)"/>
<path d="M260,340 L245,340 L245,700 L330,700 L330,712" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="250" y="696" class="l" fill="#475569">Force, PalmOn, need</text>
<path d="M818,282 L818,712" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="790" y="700" class="l" fill="#475569">Gap</text>
<path d="M380,628 L380,646 L1050,646 L1050,712" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
