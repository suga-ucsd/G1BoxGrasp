<rect x="20" y="806" width="1260" height="86" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="32" y="828" class="b">Scene values: GripSafetyFactor 2 · BoxFriction 1 · GripForceLimit 100 % · TouchForce 2 N · ApproachGap 0.02 m · MaxSqueezeDepth 0.05 m · PalmOffset 0.02 m · FrontInset 0.051 m · BeltClearance 0.02 m</text>
<text x="32" y="845" class="b">StallTime 3 s · MaxSqueezeTries 3 · PhaseTimeout 15 s · SlipTolerance 0.01 m · DropTolerance 0.05 m · LiftHeight 0.10 m · ThumbOpenDeg 30 · ThumbGripDeg 0 · ThumbTipDeg 0</text>
<text x="32" y="862" class="b">Constants: k_DepthGain 0.002 m/(N·s) · k_SqueezeMargin 1.25 · k_MaxSqueezeRate 0.02 m/s · k_Widen 0.05 m · k_CurlRate 0.5 rad/s · k_MaxCurl 0.8 rad · k_GripConfirm 0.5 s · k_HoldDepth 0.01 m</text>
<text x="32" y="879" class="b">k_PreFront 0.10 m · k_PreWiden 0.03 m · k_SlideSpeed 0.10 m/s · k_ThumbStagger 0.018 m · k_ThumbReach 0.095 m · k_ThumbClear 0.03 m (narrow = m_HalfW &lt; 0.125 m)</text>
</svg>