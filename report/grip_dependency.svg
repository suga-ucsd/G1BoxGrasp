<text x="470" y="494" class="l" fill="#475569">m_HalfW</text>
<path d="M500,214 L545,214" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="512" y="208" class="l" fill="#475569">req</text>
<path d="M500,280 L545,270" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="516" y="268" class="l" fill="#475569">F</text>
<path d="M500,330 L545,330" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M679,358 L679,376" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
