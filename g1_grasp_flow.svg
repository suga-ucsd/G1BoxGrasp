<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1110" width="880" height="1110" font-family="Helvetica, Arial, sans-serif">
<title>G1BoxGrasp phase loop</title>
<style>
rect{fill:#fff;stroke:#000;stroke-width:1.4} text{fill:#000}
.n{font-size:14px;font-weight:700;text-anchor:middle} .s{font-size:10.5px;text-anchor:middle}
.l{font-size:10.5px} .s2{font-size:11px} .h{font-size:18px;font-weight:700}
.e{fill:none;stroke:#000;stroke-width:1.4} .d{stroke-dasharray:6 4}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs>
<rect x="0" y="0" width="880" height="1110" style="stroke:none"/>
<text class="h" x="40" y="36">G1BoxGrasp: phase loop</text>
<rect x="260" y="64" width="280" height="44" rx="6"/>
<text class="n" x="400.0" y="82">Start</text>
<text class="s" x="400.0" y="98">find bodies, boxes and arms; fold the hands</text>
<rect x="260" y="128" width="280" height="44" rx="6"/>
<text class="n" x="400.0" y="146">FindBox</text>
<text class="s" x="400.0" y="162">nearest box resting on the belt</text>
<path class="e" d="M400,108 L400,128" marker-end="url(#a)"/>
<rect x="260" y="192" width="280" height="44" rx="6"/>
<text class="n" x="400.0" y="210">Approach</text>
<text class="s" x="400.0" y="226">walker bursts: turn, side-step, step (max 12)</text>
<path class="e" d="M400,172 L400,192" marker-end="url(#a)"/>
<rect x="260" y="256" width="280" height="44" rx="6"/>
<text class="n" x="400.0" y="274">Ready</text>
<text class="s" x="400.0" y="290">body still, then reach check (Hand Limit, Min Side)</text>
<path class="e" d="M400,236 L400,256" marker-end="url(#a)"/>
<rect x="260" y="320" width="280" height="44" rx="6"/>
<text class="n" x="400.0" y="338">PreGrasp</text>
<text class="s" x="400.0" y="354">hands in front of the box, tare, slide in</text>
<path class="e" d="M400,300 L400,320" marker-end="url(#a)"/>
<rect x="260" y="384" width="280" height="44" rx="6"/>
<text class="n" x="400.0" y="402">Squeeze</text>
<text class="s" x="400.0" y="418">palms close until the grip force holds 0.5 s</text>
<path class="e" d="M400,364 L400,384" marker-end="url(#a)"/>
<rect x="260" y="448" width="280" height="44" rx="6"/>
<text class="n" x="400.0" y="466">Lift</text>
<text class="s" x="400.0" y="482">raise Lift Height, slip check</text>
<path class="e" d="M400,428 L400,448" marker-end="url(#a)"/>
<rect x="260" y="512" width="280" height="44" rx="6"/>
<text class="n" x="400.0" y="530">PullIn</text>
<text class="s" x="400.0" y="546">box in to Carry Offset (chest)</text>
<path class="e" d="M400,492 L400,512" marker-end="url(#a)"/>
<rect x="260" y="576" width="280" height="44" rx="6"/>
<text class="n" x="400.0" y="594">TurnToTable</text>
<text class="s" x="400.0" y="610">rotator turn toward the table spot</text>
<path class="e" d="M400,556 L400,576" marker-end="url(#a)"/>
<rect x="260" y="640" width="280" height="44" rx="6"/>
<text class="n" x="400.0" y="658">WalkToTable</text>
<text class="s" x="400.0" y="674">walk to the stand point</text>
<path class="e" d="M400,620 L400,640" marker-end="url(#a)"/>
<rect x="260" y="704" width="280" height="44" rx="6"/>
<text class="n" x="400.0" y="722">FaceTable</text>
<text class="s" x="400.0" y="738">rotator turn square to the table</text>
<path class="e" d="M400,684 L400,704" marker-end="url(#a)"/>
<rect x="260" y="768" width="280" height="44" rx="6"/>
<text class="n" x="400.0" y="786">Place</text>
<text class="s" x="400.0" y="802">settle, move over the slot, lower to touchdown</text>
<path class="e" d="M400,748 L400,768" marker-end="url(#a)"/>
<rect x="260" y="832" width="280" height="44" rx="6"/>
<text class="n" x="400.0" y="850">Release</text>
<text class="s" x="400.0" y="866">open the palms (1.5 s)</text>
<path class="e" d="M400,812 L400,832" marker-end="url(#a)"/>
<rect x="260" y="896" width="280" height="44" rx="6"/>
<text class="n" x="400.0" y="914">Retract</text>
<text class="s" x="400.0" y="930">hands up, then fold</text>
<path class="e" d="M400,876 L400,896" marker-end="url(#a)"/>
<text class="l" x="406" y="185" text-anchor="start">WalkToBox off</text>
<rect x="34" y="160" width="206" height="44" rx="6"/>
<text class="n" x="137.0" y="178">Walk to the box</text>
<text class="s" x="137.0" y="194">FaceBox → WalkToBox → FaceChute</text>
<path class="e" d="M260,156 L137,156 L137,160" marker-end="url(#a)"/>
<text class="l" x="143" y="152" text-anchor="start">WalkToBox on</text>
<path class="e" d="M137,204 L137,214 L260,214" marker-end="url(#a)"/>
<rect x="34" y="416" width="206" height="44" rx="6"/>
<text class="n" x="137.0" y="434">DragIn</text>
<text class="s" x="137.0" y="450">grip &gt; 0.35 m ahead: drag in to 0.30 m</text>
<path class="e" d="M260,412 L137,412 L137,416" marker-end="url(#a)"/>
<text class="l" x="143" y="408" text-anchor="start">box far ahead</text>
<path class="e" d="M137,460 L137,470 L260,470" marker-end="url(#a)"/>
<rect x="34" y="806" width="206" height="44" rx="6"/>
<text class="n" x="137.0" y="824">Reposition</text>
<text class="s" x="137.0" y="840">can't lower: step closer, place again</text>
<path class="e" d="M260,796 L137,796 L137,806" marker-end="url(#a)"/>
<path class="e" d="M240,828 L250,828 L250,804 L260,804" marker-end="url(#a)"/>
<path class="e d" d="M540,398 L560,398 L560,334 L540,334" marker-end="url(#a)"/>
<text class="l" x="565" y="362" text-anchor="start">grip didn't build:</text>
<text class="l" x="565" y="374" text-anchor="start">reopen, retry</text>
<path class="e" d="M260,918 L18,918 L18,142 L260,142" marker-end="url(#a)"/>
<text class="l" transform="translate(13,534) rotate(-90)" text-anchor="middle">RepeatLoop on: next box</text>
<path class="e" d="M400,940 L400,974" marker-end="url(#a)"/>
<text class="l" x="406" y="960" text-anchor="start">RepeatLoop off</text>
<rect x="320" y="974" width="160" height="34" rx="6"/>
<text class="n" x="400.0" y="996.0">Done</text>
<path class="e d" d="M540,286 L680,286"/>
<path class="e d" d="M540,350 L680,350"/>
<path class="e d" d="M540,414 L680,414"/>
<path class="e d" d="M540,478 L680,478"/>
<path class="e d" d="M540,542 L680,542"/>
<path class="e d" d="M540,606 L680,606"/>
<path class="e d" d="M540,670 L680,670"/>
<path class="e d" d="M540,734 L680,734"/>
<path class="e d" d="M540,798 L680,798"/>
<path class="e d" d="M680,286 L680,798"/>
<rect x="700" y="520" width="160" height="44" rx="6"/>
<text class="n" x="780.0" y="538">Recover</text>
<text class="s" x="780.0" y="554">stop walking, fold the arms</text>
<path class="e d" d="M680,542 L700,542" marker-end="url(#a)"/>
<text class="l" x="676" y="281" text-anchor="end">Fail(why)</text>
<path class="e d" d="M780,520 L780,158 L540,158" marker-end="url(#a)"/>
<text class="l" x="786" y="190" text-anchor="start">retry: next box</text>
<text class="l" x="786" y="202" text-anchor="start">(box skipped after</text>
<text class="l" x="786" y="214" text-anchor="start">MaxBoxAttempts)</text>
<path class="e d" d="M780,564 L780,604" marker-end="url(#a)"/>
<text class="l" x="786" y="588" text-anchor="start">no retry</text>
<rect x="720" y="604" width="120" height="34" rx="6"/>
<text class="n" x="780.0" y="626.0">Failed</text>
<path class="e" d="M40,1024 L80,1024" marker-end="url(#a)"/>
<text class="l" x="88" y="1028" text-anchor="start">normal flow</text>
<path class="e d" d="M200,1024 L240,1024" marker-end="url(#a)"/>
<text class="l" x="248" y="1028" text-anchor="start">failure / retry</text>
<text class="s2" x="40" y="1050" text-anchor="start">Switches: LiftBox off → Squeeze → Release · CarryToTable off → Lift → Place (back where it was picked) · PlaceBox off → keep holding</text>
<text class="s2" x="40" y="1068" text-anchor="start">Test modes: WalkerTest / ArmTest → Start → test → Done (no grasp)</text>
</svg>
